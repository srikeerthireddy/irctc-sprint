<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1100" viewBox="0 0 900 1100">
  <rect width="900" height="1100" fill="#f7f7f7"/>
  <rect x="40" y="40" width="820" height="90" rx="12" fill="#fff" stroke="#999"/>
  <text x="70" y="95" font-family="Arial" font-size="32" fill="#222">Passenger details</text>
  <rect x="40" y="170" width="820" height="390" rx="12" fill="#fff" stroke="#999"/>
  <text x="70" y="220" font-family="Arial" font-size="28" fill="#222">Passenger 1</text>
  <rect x="70" y="250" width="300" height="50" rx="8" fill="#f1f1f1" stroke="#999"/>
  <rect x="390" y="250" width="140" height="50" rx="8" fill="#f1f1f1" stroke="#999"/>
  <text x="90" y="284" font-family="Arial" font-size="20" fill="#666">Name</text>
  <text x="410" y="284" font-family="Arial" font-size="20" fill="#666">Age</text>
  <text x="70" y="340" font-family="Arial" font-size="28" fill="#222">Seat preference</text>
  <text x="90" y="390" font-family="Arial" font-size="22" fill="#444">( ) No preference</text>
  <text x="90" y="430" font-family="Arial" font-size="22" fill="#444">( ) Lower berth</text>
  <text x="90" y="470" font-family="Arial" font-size="22" fill="#444">( ) Side lower</text>
  <text x="90" y="510" font-family="Arial" font-size="22" fill="#444">( ) Window / aisle</text>
  <rect x="70" y="580" width="200" height="60" rx="10" fill="#17324d"/>
  <rect x="290" y="580" width="160" height="60" rx="10" fill="#fff" stroke="#17324d"/>
  <text x="95" y="618" font-family="Arial" font-size="22" fill="#fff">Save preference</text>
  <text x="330" y="618" font-family="Arial" font-size="22" fill="#17324d">Continue</text>
  <rect x="40" y="620" width="820" height="180" rx="12" fill="#e9f8ee" stroke="#4b9d61"/>
  <text x="70" y="675" font-family="Arial" font-size="26" fill="#205a32">Draft saved state</text>
  <text x="70" y="720" font-family="Arial" font-size="22" fill="#205a32">On error, return to this draft with choices preserved.</text>
</svg>