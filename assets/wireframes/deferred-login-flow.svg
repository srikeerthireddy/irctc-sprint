<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1000" viewBox="0 0 900 1000">
  <rect width="900" height="1000" fill="#f7f7f7"/>
  <rect x="40" y="40" width="820" height="90" rx="12" fill="#fff" stroke="#999"/>
  <text x="70" y="95" font-family="Arial" font-size="32" fill="#222">Search first</text>
  <rect x="40" y="170" width="820" height="150" rx="12" fill="#fff" stroke="#999"/>
  <text x="70" y="225" font-family="Arial" font-size="28" fill="#222">From | To | Date | Search</text>
  <rect x="70" y="255" width="160" height="45" rx="8" fill="#17324d"/>
  <text x="105" y="285" font-family="Arial" font-size="20" fill="#fff">Search</text>
  <rect x="40" y="370" width="820" height="260" rx="12" fill="#fff" stroke="#999"/>
  <text x="70" y="425" font-family="Arial" font-size="28" fill="#222">Checkout checkpoint</text>
  <rect x="70" y="450" width="320" height="180" rx="12" fill="#f1f1f1" stroke="#999"/>
