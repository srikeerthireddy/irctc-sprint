  <rect x="40" y="680" width="820" height="160" rx="12" fill="#e9f8ee" stroke="#4b9d61"/>
  <text x="70" y="735" font-family="Arial" font-size="26" fill="#205a32">Flow change</text>
  <text x="70" y="780" font-family="Arial" font-size="22" fill="#205a32">Login is delayed until a booking action actually requires it.</text>
